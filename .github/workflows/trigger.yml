name: Trigger Jenkins on Mention

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    env:
      JENKINS_URL: http://148.100.85.217:8080
      JENKINS_USER: admin
      JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

    if: |
      github.event.comment.body != '' &&
      (
        contains(toJson(github.event.comment.body), '@dotnet-s390x build') ||
        contains(toJson(github.event.comment.body), '@dotnet-s390x cancel')
      )

    steps:
      - name: Extract PR number and intent
        id: meta
        run: |
          echo "pr_number=$(jq -r .issue.number "$GITHUB_EVENT_PATH")" >> "$GITHUB_OUTPUT"
          body="${{ github.event.comment.body }}"
          [[ "$body" =~ @dotnet-s390x[[:space:]]+cancel ]] && echo "cancel=true" >> "$GITHUB_OUTPUT" || echo "cancel=false" >> "$GITHUB_OUTPUT"

      - name: Cancel Jenkins build/queue if needed
        if: steps.meta.outputs.cancel == 'true'
        run: |
          auth="-u $JENKINS_USER:$JENKINS_TOKEN"
          pr="${{ steps.meta.outputs.pr_number }}"

          # Cancel running build
          info=$(curl -s $auth "$JENKINS_URL/job/dotnet-builds/lastBuild/api/json")
          if [ "$(echo "$info" | jq -r '.building')" = "true" ]; then
            bpr=$(echo "$info" | jq -r '.actions[]?.parameters[]? | select(.name=="pr_number") | .value')
            [ "$bpr" = "$pr" ] && curl -X POST $auth "$JENKINS_URL/job/dotnet-builds/$(echo "$info" | jq -r .number)/stop"
          fi

          # Cancel queued items
          curl -s $auth "$JENKINS_URL/queue/api/json" | jq -c '.items[]' | while read -r item; do
            [ "$(echo "$item" | jq -r '.actions[]?.parameters[]? | select(.name=="pr_number") | .value')" = "$pr" ] &&
            curl -X POST $auth "$JENKINS_URL/queue/cancelItem?id=$(echo "$item" | jq -r .id)"
          done

      - name: Check for duplicate build
        if: steps.meta.outputs.cancel != 'true'
        id: dupe
        run: |
          auth="-u $JENKINS_USER:$JENKINS_TOKEN"
          pr="${{ steps.meta.outputs.pr_number }}"
          running=$(curl -s $auth "$JENKINS_URL/job/dotnet-builds/lastBuild/api/json" | jq -r '
            select(.building==true) |
            .actions[]? | select(.parameters) |
            .parameters[]? | select(.name=="pr_number") | .value // ""')

          queued=$(curl -s $auth "$JENKINS_URL/queue/api/json" | jq -r '
            [.items[]? | .actions[]?.parameters[]? | select(.name=="pr_number") | .value] | .[]')

          [[ "$running" == "$pr" || "$queued" == *"$pr"* ]] &&
            echo "duplicate=true" >> "$GITHUB_OUTPUT" || echo "duplicate=false" >> "$GITHUB_OUTPUT"

      - name: Comment if duplicate build exists
        if: steps.dupe.outputs.duplicate == 'true'
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "{\"body\": \"A build is already running or queued for PR #${{ steps.meta.outputs.pr_number }}. Please comment \\\"@dotnet-s390x cancel\\\" to stop it before triggering again.\"}" \
               "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.meta.outputs.pr_number }}/comments"

      - name: Get PR branches
        if: steps.dupe.outputs.duplicate == 'false'
        id: pr
        run: |
          pr_data=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.meta.outputs.pr_number }}")
          echo "head_branch=$(echo "$pr_data" | jq -r .head.ref)" >> "$GITHUB_OUTPUT"
          echo "base_branch=$(echo "$pr_data" | jq -r .base.ref)" >> "$GITHUB_OUTPUT"

      - name: Trigger Jenkins build
        if: steps.dupe.outputs.duplicate == 'false'
        run: |
          curl -X POST "$JENKINS_URL/job/dotnet-builds/buildWithParameters" \
            -u "$JENKINS_USER:$JENKINS_TOKEN" \
            --data-urlencode "pr_number=${{ steps.meta.outputs.pr_number }}" \
            --data-urlencode "comment_user=${{ github.actor }}" \
            --data-urlencode "comment_body=${{ github.event.comment.body }}" \
            --data-urlencode "head_branch=${{ steps.pr.outputs.head_branch }}" \
            --data-urlencode "base_branch=${{ steps.pr.outputs.base_branch }}"


